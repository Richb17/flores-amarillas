<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenida la primavera</title>
<style>
  :root {
    --yellow: #ffd93d;
    --yellow-dark: #f4b400;
    --center: #d68910;
    --sky: #eaf6e9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(circle at 10% 20%, var(--yellow) 0 18px, transparent 19px),
      radial-gradient(circle at 30% 10%, var(--yellow-dark) 0 14px, transparent 15px),
      radial-gradient(circle at 55% 25%, var(--yellow) 0 20px, transparent 21px),
      radial-gradient(circle at 80% 15%, var(--yellow-dark) 0 16px, transparent 17px),
      radial-gradient(circle at 95% 40%, var(--yellow) 0 18px, transparent 19px),
      radial-gradient(circle at 15% 55%, var(--yellow-dark) 0 22px, transparent 23px),
      radial-gradient(circle at 45% 65%, var(--yellow) 0 16px, transparent 17px),
      radial-gradient(circle at 70% 55%, var(--yellow-dark) 0 20px, transparent 21px),
      radial-gradient(circle at 90% 75%, var(--yellow) 0 18px, transparent 19px),
      radial-gradient(circle at 25% 85%, var(--yellow-dark) 0 16px, transparent 17px),
      radial-gradient(circle at 60% 90%, var(--yellow) 0 20px, transparent 21px),
      radial-gradient(circle at 5% 90%, var(--yellow-dark) 0 14px, transparent 15px),
      linear-gradient(160deg, var(--sky), #d9f0d3 60%, #cdeac6);
    background-repeat: no-repeat;
    background-size: cover;
    overflow: hidden;
    position: relative;
  }

  /* pétalos de cada flor, dibujados alrededor de los centros de arriba */
  body::before, body::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      var(--flower), var(--flower), var(--flower), var(--flower),
      var(--flower), var(--flower), var(--flower), var(--flower),
      var(--flower), var(--flower), var(--flower), var(--flower);
    background-repeat: no-repeat;
  }

  :root {
    --flower: radial-gradient(circle, var(--center) 0 6px, transparent 7px);
  }

  body::before {
    background-position:
      10% 20%, 30% 10%, 55% 25%, 80% 15%,
      95% 40%, 15% 55%, 45% 65%, 70% 55%,
      90% 75%, 25% 85%, 60% 90%, 5% 90%;
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2.5rem 3rem;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
    max-width: 90vw;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: #5b7d3a;
    letter-spacing: 1px;
  }

  p {
    margin: 0.75rem 0 0;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: #7a8a5f;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Bienvenida la primavera</h1>
    <p>Que cada flor amarilla te recuerde a florecer de nuevo.</p>
  </div>
</body>
</html>
